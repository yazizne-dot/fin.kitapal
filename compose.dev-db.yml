services:
  postgres:
    # Matches pg_restore 18 used to read the handoff archive.
    image: postgres:18
    environment:
      POSTGRES_DB: fin
      POSTGRES_USER: qarzhy_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15434}:5432"
    volumes:
      - qarzhy_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qarzhy_dev -d fin"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  qarzhy_dev_pgdata:
