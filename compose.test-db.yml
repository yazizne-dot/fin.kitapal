services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fin_test
      POSTGRES_USER: qarzhy_test
      POSTGRES_PASSWORD: test_only_password
    ports:
      - '127.0.0.1:15435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qarzhy_test -d fin_test']
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
